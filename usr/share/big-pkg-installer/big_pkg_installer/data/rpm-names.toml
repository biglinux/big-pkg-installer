# Fedora / openSUSE / RHEL package names (and file requirements) -> Arch.
#
# Libraries are normally found by reading the ELF files of the package;
# names that already exist in Arch with the same (lowercased) name, and
# "python3-foo" -> "python-foo", are matched automatically.
# An empty string means "nothing to install on Arch".


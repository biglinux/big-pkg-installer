name: Tests

on:
  push:
    branches: [ "*" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git python python-pytest python-gobject gtk4 libadwaita \
            fakeroot binutils zstd libarchive sudo ruff
          pacman -Fy --noconfirm

      - uses: actions/checkout@v4

      - name: Lint
        run: ruff check usr tests

      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 pytest -q -p no:cacheprovider -m "not slow"

      - name: End-to-end builds (makepkg refuses to run as root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder env PYTHONDONTWRITEBYTECODE=1 pytest -q -p no:cacheprovider -m slow
